# Copy to app/.streamlit/secrets.toml for local runs, or paste into Streamlit Cloud's Secrets.
# Never commit the real file (it is in .gitignore).

SNOWFLAKE_HOST = "<account_identifier>.snowflakecomputing.com"
SNOWFLAKE_PAT = "<programmatic access token for FORK_APP_USER>"
DATABASE = "GENERAL_AGENT_DEMO"
SCHEMA = "RESTAURANT"
AGENT_NAME = "AGENTFORK"

# Local preview only: pretend to be signed in as this person (leave out on Streamlit Cloud)
# DEV_USER_EMAIL = "you@ailodata.com"

# Who may sign in. Leave both out to let any Google account in.
# ALLOWED_DOMAINS = ["ailodata.com"]
# ALLOWED_EMAILS = ["someone@example.com"]

# Optional: change the app's name and contact
# [branding]
# page_title = "AILO — FORK Analytics"
# kicker = "AILO — FORK ANALYTICS"
# contact_email = "contact@ailodata.com"
# file_prefix = "fork_data"

# Access: by default, manage who can open the app with Streamlit Cloud's sharing
# (Settings -> Sharing -> Only specific people). The app then needs no [auth] section.
#
# Alternative: Google sign-in in the app itself. Without this section the app runs without sign-in.
# The Google values go under [auth.google], because the app signs in with st.login("google").
# Keep ALLOWED_DOMAINS / ALLOWED_EMAILS above [auth].
# [auth]
# redirect_uri = "https://<your-app>.streamlit.app/oauth2callback"
# cookie_secret = "<long random string>"
#
# [auth.google]
# client_id = "<Google OAuth client id>"
# client_secret = "<Google OAuth client secret>"
# server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
